name: test-surface

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-surface-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun test ./tests/oracle.oracle.ts
      - run: bun test ./tests/corpus.oracle.ts
      - run: bun test ./tests/differential.gpu.ts
      - run: bun test ./tests/headless.gpu.ts
